server:
  # Render's managed PORT variable is currently being passed through as a
  # literal placeholder. Keep the service bound to the Docker-exposed port.
  port: 10000
  error:
    include-message: always

spring:
  application:
    name: interviewhub-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/interviewhub}}
    username: ${DATABASE_USERNAME:interviewhub}
    password: ${DATABASE_PASSWORD:interviewhub}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:interviewhub}
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DB_SCHEMA:interviewhub}
    schemas: ${DB_SCHEMA:interviewhub}
    create-schemas: true

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4028}
  payments:
    provider: ${PAYMENT_PROVIDER:razorpay}
  storage:
    resume-bucket: ${RESUME_BUCKET:interviewhub-resumes}
